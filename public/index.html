<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light dark">

        <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
        <script
            src="https://code.jquery.com/jquery-4.0.0.slim.min.js"
            integrity="sha256-8DGpv13HIm+5iDNWw1XqxgFB4mj+yOKFNb+tHBZOowc="
            crossorigin="anonymous">
        </script>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

        <style>
            .propertyText {
                width: 100% !important;
                margin-right: 5px !important;
            }
            .propertyNumber {
                width: 60px !important;
                margin-right: 5px !important;
            }
            .numberDiv {
                margin-top: 10px !important;
                display: inline-flex !important;
                height: 50px !important;
                margin-right: 5px !important;
            }
            .numberButton {
                width: 50px !important;
                height: 50px !important;
                margin-right: 5px !important;
            }
            .propertyLabel {
                width: 100px;
                margin-right: 5px;
            }
            .footerButton {
                margin-bottom: 5px;
            }
        </style>
    </head>    

    <script>
        var socket = null;

        function connect() {
            socket = new WebSocket("wss://socket-server-template-oqi7.onrender.com:443");

            socket.onopen = () => {
                console.log("WebSocket connection opened");
                $("#status").text("🟢 Connected")
                sendAction("getProperties")
            };

            socket.onmessage = (event) => {
                console.log("Message from the server:", event.data);
                if (event.data != "ping") {
                    let json = JSON.parse(event.data)
                    if (json.action == "setPropertiesFromTD") {
                        createForm(json.properties)
                    }
                }                
            };

            socket.onclose = (event) => {
                console.log("WebSocket connection closed");
                $("#status").text("🔴 Not Connected")
                connect()
            };

            socket.onerror = (error) => {
                console.error("WebSocket error:", error);
                $("#status").text("🔴 Error" + error)
            };
        }

        function createForm(properties) {
            let form = $('#form');
            form.empty();
            Object.keys(properties).forEach(key => {
                let propValue = properties[key]
                var formItems = '';
                
                if (Number.isFinite(Number(propValue))) {
                    formItems += '<div class="numberDiv">'
                    formItems += '<label class="propertyLabel" for="' + key + '" class="itemLabel">' + key + '</label>';
                    formItems += '<input class="propertyNumber paddedRight" type="number" id="' + key + '" name="' + key + '" value="' + propValue + '"/>';
                    formItems += '<button type="button" class="numberButton" onClick="increment(\''+ key + '\')")>+</button>';
                    formItems += '<button type="button" class="numberButton" onClick="decrement(\''+ key + '\')")>-</button>';
                    formItems += "</div>"
                } else {
                    formItems += '<label class="propertyLabel" for="' + key + '" class="itemLabel">' + key + '</label>';
                    formItems += '<input class="propertyText" type="text" id="' + key + '" name="' + key + '" value="' + propValue + '"/>';
                }

                form.append(formItems);
            });
        }

        function increment(id) {
            var propValue = Number($("#"+id).val());
             $("#"+id).val(propValue+1);
             sendValues();
        }

        function decrement(id) {
            var propValue = Number($("#"+id).val());
            if (propValue > 0) {
                $("#"+id).val(propValue-1);
            }
            sendValues();
        }

        function sendValues() {
            if (socket) {
                let props = $('#form')
                    .serializeArray()
                    .reduce(function (json, { name, value }) {
                        json[name] = value;
                        return json;
                    }, {});
                let action = {
                    action: "setPropertiesFromFront",
                    properties: props
                }
                socket.send(JSON.stringify(action));
            }
        }

        function sendAction(value) {
            console.log('Sending action: ' + value)
            if (socket) {
                let action = {
                    action: value
                }
                socket.send(JSON.stringify(action));
            }
        }

        $(window).on("load", function() {
            connect()
        });

    </script>

    <body style="padding: 10px;">
        <header>
            <h2 id="status">🔴 Not Connected</h2>          
        </header>
        <main>
            <h3>Parameters</h3>
            <form id="form"></form>
            <h3>Actions</h3>
            <footer>
                <button class="footerButton" style="background-color:red;" onclick="sendAction('explode')">Explode!</button>
                <button class="footerButton" onclick="if (confirm('Reset?')) sendAction('reset')">Reset</button>
            </footer>
        </main>
    </body>
</html>
